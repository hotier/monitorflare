name: Deploy monitorflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

# checkout / setup-node 均已升到 v5，自带 node24 运行时，
# 故不再需要 FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 来压制 node20 弃用警告。
env:
  WORKER_NAME: monitorflare-worker
  D1_NAME: monitorflare-db
  PAGES_PROJECT: monitorflare

jobs:
  # ── 门禁：任何部署前必须先通过 lint / 类型检查 / 测试 ──
  verify:
    name: Verify (lint / typecheck / test)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          # v5 新增：一旦 package.json 出现 packageManager 字段就会自动开缓存。
          # 本仓库靠显式 cache-dependency-path 精确指定三个 lock 文件，
          # 这里关掉自动推断，避免将来有人补上该字段后缓存键悄然改变。
          package-manager-cache: false
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
            frontend/package-lock.json

      # 仓库级 ESLint 9 flat config
      - name: Install root tooling
        run: npm ci

      - name: Lint
        run: npm run lint

      # Worker：类型检查 + 在 workerd/D1 中跑单元与集成测试
      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Typecheck worker
        working-directory: worker
        run: npm run typecheck

      - name: Test worker
        working-directory: worker
        run: npm test

      # Frontend：在 jsdom 中跑工具函数与组件测试
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test frontend
        working-directory: frontend
        run: npm test

  deploy-worker:
    name: Deploy Worker (Backend)
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          package-manager-cache: false
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      # 只依赖 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID：
      # D1 库不存在则自动创建，database_id 从 wrangler 输出中解析后再写入配置。
      - name: Resolve D1 database id
        id: d1
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID_INPUT: ${{ secrets.D1_DATABASE_ID }}
        run: |
          set -euo pipefail

          # 1) 显式提供的 secret 优先
          if [ -n "${D1_DATABASE_ID_INPUT:-}" ]; then
            echo "id=$D1_DATABASE_ID_INPUT" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2) 已存在的同名库直接复用
          DB_ID=$(npx wrangler d1 list --json 2>/dev/null \
            | jq -r --arg name "$D1_NAME" '.[] | select(.name == $name) | .uuid' \
            | head -n 1 || true)

          # 3) 都没有则创建,并从输出里解析 uuid
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            npx wrangler d1 create "$D1_NAME" 2>&1 | tee d1-create.log || true
            DB_ID=$(grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' d1-create.log \
              | head -n 1 || true)
          fi

          if [ -z "$DB_ID" ]; then
            echo "::error::无法创建或解析 D1 数据库 $D1_NAME 的 database_id"
            exit 1
          fi

          echo "::notice::使用 D1 数据库 $D1_NAME ($DB_ID)"
          echo "id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve Worker URL
        id: worker_url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          SUBDOMAIN=$(curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            2>/dev/null | jq -r '.result.subdomain // empty' 2>/dev/null || true)

          if [ -n "$SUBDOMAIN" ]; then
            echo "url=https://$WORKER_NAME.$SUBDOMAIN.workers.dev" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未检测到 workers.dev 子域,跳过 WORKER_URL 自动配置"
            echo "url=" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate wrangler.toml
        working-directory: worker
        run: |
          ALLOWED_ORIGIN="${{ vars.ALLOWED_ORIGIN }}"
          [ -z "$ALLOWED_ORIGIN" ] && ALLOWED_ORIGIN="https://$PAGES_PROJECT.pages.dev"

          BASE_URL="${{ vars.BASE_URL }}"
          [ -z "$BASE_URL" ] && BASE_URL="https://$PAGES_PROJECT.pages.dev"

          SESSION_TTL_HOURS="${{ vars.SESSION_TTL_HOURS }}"
          [ -z "$SESSION_TTL_HOURS" ] && SESSION_TTL_HOURS="12"

          cat > wrangler.toml << WRANGLER_EOF
          name = "$WORKER_NAME"
          main = "src/index.ts"
          compatibility_date = "2024-02-08"

          [triggers]
          crons = ["* * * * *"]

          [[d1_databases]]
          binding = "DB"
          database_name = "$D1_NAME"
          database_id = "${{ steps.d1.outputs.id }}"

          [vars]
          ALLOWED_ORIGIN = "$ALLOWED_ORIGIN"
          SESSION_TTL_HOURS = "$SESSION_TTL_HOURS"
          BASE_URL = "$BASE_URL"
          WRANGLER_EOF

      # 直接用 worker 里锁定的 wrangler（devDependencies: wrangler ^4），
      # 不再走 cloudflare/wrangler-action：它跑在已弃用的 node20 上，
      # 还会额外装一个 wrangler@3.90.0，与本 job 其它步骤用的 v4 不一致。
      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      # 首次运行配置管理员凭据并写进 Worker secret。
      # 已存在的不覆盖，所以重复部署时密码保持稳定。
      #
      # 三点说明：
      #   1) 列出 secret 走 Cloudflare REST API 而不是 `wrangler secret list --json`，
      #      后者在部分版本会把升级提示混进 stdout，导致 jq 解析失败而整步跳过。
      #   2) 写入 secret 必须用 `wrangler secret put` 而不是 REST PUT：
      #      REST PUT 会基于旧的上传记录创建 deployment，把刚部署的新版本
      #      回滚成旧版本（2026-09 实测：部署后 2 秒被顶回旧版，全站 1101）。
      #   3) 本仓库是公开仓库，运行摘要/日志任何访客都能看到，
      #      因此这里绝不输出自动生成的密码：管理员密码只能来自 Actions secret。
      - name: Provision admin credentials (first run only)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_API_KEY_INPUT: ${{ secrets.ADMIN_API_KEY }}
        run: |
          set -euo pipefail

          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER_NAME/secrets"

          RESP=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" 2>/dev/null || true)
          if ! printf '%s' "$RESP" | jq -e '.success == true' > /dev/null 2>&1; then
            echo "::warning::无法读取现有 secrets,跳过凭据配置（响应: $RESP）"
            exit 0
          fi

          EXISTING=$(printf '%s' "$RESP" | jq -r '.result[]?.name // empty')

          put_secret() {
            # wrangler secret put 感知 Versions/Deployments API，写入时保留当前部署的代码
            printf '%s' "$2" | npx wrangler secret put "$1"
          }

          if printf '%s\n' "$EXISTING" | grep -qx "ADMIN_API_KEY"; then
            echo "::notice::ADMIN_API_KEY 已存在,保持不变"
          elif [ -n "${ADMIN_API_KEY_INPUT:-}" ]; then
            put_secret ADMIN_API_KEY "$ADMIN_API_KEY_INPUT"
            echo "::notice::已用仓库 secret ADMIN_API_KEY 写入 Worker"
          else
            echo "::warning::未配置管理员密码:请在本仓库 Settings → Secrets 添加 ADMIN_API_KEY（可本地 openssl rand -hex 24 生成）后重跑。本工作流不会输出自动生成的密码，因为公开仓库的运行摘要任何人可见。"
          fi

          if printf '%s\n' "$EXISTING" | grep -qx "MAGIC_LINK_SECRET"; then
            echo "::notice::MAGIC_LINK_SECRET 已存在,保持不变"
          else
            put_secret MAGIC_LINK_SECRET "$(openssl rand -hex 32)"
            echo "::notice::已生成并写入 MAGIC_LINK_SECRET（内容不输出）"
          fi

  deploy-pages:
    name: Deploy Pages (Frontend)
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          package-manager-cache: false
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_CF_ANALYTICS_TOKEN: ${{ secrets.VITE_CF_ANALYTICS_TOKEN }}
          VITE_FOOTER_AUTHOR: ${{ vars.VITE_FOOTER_AUTHOR }}
          VITE_FOOTER_URL: ${{ vars.VITE_FOOTER_URL }}

      # `wrangler pages project create` 不是幂等的：项目已存在时返回 8000002
      # 并以 exit code 1 退出。原先靠 continue-on-error 兜底，代价是每次部署
      # 都会留下一条红色失败步骤。这里先用 REST API 探测，仅在缺失时才创建。
      - name: Create Pages project (if not exists)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT"

          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API")

          if [ "$STATUS" = "200" ]; then
            echo "::notice::Pages 项目 $PAGES_PROJECT 已存在，跳过创建"
            exit 0
          fi

          if [ "$STATUS" != "404" ]; then
            echo "::error::查询 Pages 项目失败（HTTP $STATUS），请检查 CLOUDFLARE_API_TOKEN 是否具备 Pages:Edit 权限"
            exit 1
          fi

          echo "Pages 项目 $PAGES_PROJECT 不存在，开始创建…"
          npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main

      - name: Resolve Worker URL
        id: worker_url
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          SUBDOMAIN=$(curl -sS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            2>/dev/null | jq -r '.result.subdomain // empty' 2>/dev/null || true)

          if [ -n "$SUBDOMAIN" ]; then
            echo "url=https://$WORKER_NAME.$SUBDOMAIN.workers.dev" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::未检测到 workers.dev 子域,跳过 WORKER_URL 自动配置"
            echo "url=" >> "$GITHUB_OUTPUT"
          fi

      # _worker.js 靠 Pages 项目的 WORKER_URL 反向代理 /api/*,
      # 这一步通过 API 写入,免去手动配置(Dashboard 里也能改,但会被这里覆盖成同一值)。
      - name: Configure Pages environment variables
        if: steps.worker_url.outputs.url != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          SITE_ORIGIN="${{ vars.ALLOWED_ORIGIN }}"
          [ -z "$SITE_ORIGIN" ] && SITE_ORIGIN="https://$PAGES_PROJECT.pages.dev"

          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT"

          # 先取现有变量再合并,避免清掉手动加的其它配置
          CURRENT=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" \
            | jq -c '.result.deployment_configs.production.env_vars // {}')

          ENV_VARS=$(jq -cn \
            --argjson cur "$CURRENT" \
            --arg worker "${{ steps.worker_url.outputs.url }}" \
            --arg origin "$SITE_ORIGIN" \
            '$cur + {WORKER_URL: {value: $worker}, ALLOWED_ORIGIN: {value: $origin}}')

          BODY=$(jq -cn --argjson vars "$ENV_VARS" \
            '{deployment_configs: {production: {env_vars: $vars}, preview: {env_vars: $vars}}}')

          curl -sS -X PATCH \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "$API" -d "$BODY" | jq -e '.success' > /dev/null

          echo "::notice::已写入 Pages 环境变量 WORKER_URL=${{ steps.worker_url.outputs.url }}"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy frontend/dist --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true
