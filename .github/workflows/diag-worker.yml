name: diag-worker
on:
  push:
    paths:
      - .github/workflows/diag-worker.yml
jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tail worker and probe
        run: |
          cd worker
          (npx --yes wrangler@4 tail monitorflare-worker --format=json > /tmp/tail.log 2>&1 &)
          sleep 30
          echo "== probe =="
          curl -sS -o /tmp/resp -w "status=%{http_code}\n" "https://monitorflare-worker.lht1976277790-002.workers.dev/settings" || true
          head -c 300 /tmp/resp; echo
          sleep 15
          pkill -f "wrangler tail" || true
          echo "== tail lines =="
          wc -l /tmp/tail.log
          grep -h "^{" /tmp/tail.log | jq -c "{outcome, exceptions: [.exceptions[]? | {name, message}], logs: [.logs[]? | .message]}" | tail -n 8
          echo "== raw tail =="
          tail -n 6 /tmp/tail.log
